name: spec

on:
  pull_request:
    paths:
      - 'spec/**'
      - '.github/workflows/spec.yml'
  push:
    branches: [master]
    paths:
      - 'spec/**'
      - '.github/workflows/spec.yml'

permissions:
  contents: read

concurrency:
  group: spec-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: spec/tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: spec/tools/package-lock.json
      - run: npm ci
      - name: Lint the OpenAPI files
        run: npm run lint
      - name: Validate the example responses against the schemas
        run: npm run examples
